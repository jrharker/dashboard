<title>Dashboard</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#1f6b3a;
  overscroll-behavior-y:none;
}
.frame-wrap{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
}
.safe-top{
  flex:0 0 auto;
  height:env(safe-area-inset-top);
  background:#1f6b3a;
}
.safe-bottom{
  flex:0 0 auto;
  height:env(safe-area-inset-bottom);
  background:#f4f6f9;
}
iframe{
  flex:1 1 auto;
  width:100%;
  border:0;
  display:block;
}
</style>
</head>
<body>
<div class="frame-wrap">
  <div class="safe-top"></div>
  <iframe id="dashboardFrame" src="https://script.google.com/macros/s/AKfycbzmlU9QK4Bio6JDcoWQTsmmdRC4Dw1hSIIjdiHKhF6Veu0N9DJen2SFjQwbGukQT30M9w/exec" title="Dashboard" allow="clipboard-write"></iframe>
  <div class="safe-bottom"></div>
</div>




<script>
(function() {
  var frame = document.getElementById('dashboardFrame');
  var baseUrl = 'https://script.google.com/macros/s/AKfycbzmlU9QK4Bio6JDcoWQTsmmdRC4Dw1hSIIjdiHKhF6Veu0N9DJen2SFjQwbGukQT30M9w/exec';

  function applyRoute() {
    var route = (window.location.hash || '#weight').replace('#', '').toLowerCase();
    var src = baseUrl;

    if (route === 'body' || route === 'body-current') {
      src = baseUrl + '?page=body&view=current';
    } else if (route === 'body-change-30d') {
      src = baseUrl + '?page=body&view=change&period=30d';
    } else if (route === 'body-change-90d') {
      src = baseUrl + '?page=body&view=change&period=90d';
    } else if (route === 'body-change-all') {
      src = baseUrl + '?page=body&view=change&period=all';
    } else {
      src = baseUrl;
    }

    if (frame.getAttribute('src') !== src) {
      frame.src = src;
    }
  }

  window.addEventListener('hashchange', applyRoute);
  applyRoute();
})();
</script>

</body>
</html>
